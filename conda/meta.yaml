requirements:
  host:
    - python
    - pip
    - setuptools_scm
    - setuptools
  run:
    - channels =4.1
    - channels_redis =4.2
    - django =5.2
    - django-auth-ldap =5.4
    - django-cors-headers =4.4
    - djangorestframework =3.15
    - drf-yasg =1.21
    - python-ldap =3.4
    - psycopg =3.2
    - standard-imghdr =3.13
    - uvicorn =0.37