[build-system]
requires = [ "setuptools", "setuptools_scm" ]
build-backend = "setuptools.build_meta"

[project]
name = "LOVE-manager"
description = "LSST Operators Visualization Environment (LOVE) service that acts as middleware for the LOVE-frontend."
license = { text = "GPL" }
classifiers = [ "Programming Language :: Python :: 3" ]
urls = { documentation = "https://love-manager.lsst.io", repository = "https://github.com/lsst-ts/LOVE-manager" }
dynamic = [ "version" ]

[tool.setuptools.dynamic]
version = { attr = "setuptools_scm.get_version" }

[tool.setuptools.packages.find]
where = [ "manager" ]

[tool.setuptools_scm]
write_to = "manager/version.py"
write_to_template = """
# Generated by setuptools_scm
__all__ = ["__version__"]
__version__ = "{version}"
"""

[tool.pytest.ini_options]
asyncio_mode = "strict"

[project.optional-dependencies]
dev = [
  "documenteer[pipelines]",
]
