[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "LOVE-manager"
description = "LSST Operators Visualization Environment (LOVE) service that acts as middleware for the LOVE-frontend."
license = { text = "GPL" }
classifiers = [ "Programming Language :: Python :: 3" ]
urls = { documentation = "https://love-manager.lsst.io", repository = "https://github.com/lsst-ts/LOVE-manager" }
dynamic = [ "version" ]

[project.scripts]
manage_love = "love.manager.manage:main"

[tool.setuptools.dynamic]
version = { attr = "setuptools_scm.get_version" }

[tool.setuptools.packages.find]
where = [ "python" ]

[tool.setuptools_scm]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = "python/love/manager"
addopts = "--import-mode=importlib"
python_files = ["test_*.py", "tests_*.py", "tests.py"]
DJANGO_SETTINGS_MODULE = "manager.settings"
env = [
  "TESTING=True",
  "SHOW_TRACE_TIMESTAMPS=false",
]

[project.optional-dependencies]
dev = [
  "documenteer[pipelines]",
]
